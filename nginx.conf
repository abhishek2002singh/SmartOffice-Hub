# Nginx configuration for AMS — ams.ankdigitalmedia.com
# Place at /etc/nginx/sites-available/ams and symlink to sites-enabled/

upstream ams_api {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ams.ankdigitalmedia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ams.ankdigitalmedia.com;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/ams.ankdigitalmedia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ams.ankdigitalmedia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1024;

    # API proxy
    location /api/ {
        proxy_pass         http://ams_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # Limit body size
        client_max_body_size 20M;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass         http://ams_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Frontend SPA (serve built files)
    location / {
        root   /var/www/ams/frontend/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check (no logging)
    location = /api/v1/health {
        access_log off;
        proxy_pass http://ams_api;
    }
}
